<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake — Modifier Lab</title>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#1d1d1d;--fg:#f4f4f4;--muted:#999;--line:#333;--accent:#fff;--danger:#aaa}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
#app{width:min(1180px,96vw);padding:24px 0 40px}
header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
h1{font-size:34px;margin:0;letter-spacing:.5px}
.subtitle{color:var(--muted);margin-top:5px;font-size:13px}
#hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:6px;min-width:84px;text-align:center}
.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.stage{background:#000;border:1px solid var(--line);padding:10px;border-radius:7px}
#game{display:block;width:100%;height:auto;image-rendering:pixelated;background:#000}
.toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button,select,input{font:inherit}
button{background:#eee;color:#111;border:0;border-radius:5px;padding:9px 12px;font-weight:700;cursor:pointer}
button:hover{background:#ccc}
button.secondary{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
button.secondary:hover{background:#282828}
button.danger{background:#444;color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:15px}
.panel h2{font-size:16px;margin:0 0 12px}
.group{border-top:1px solid var(--line);padding:12px 0}
.group:first-of-type{border-top:0;padding-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 0}
.row label{font-size:13px;color:#ddd}
.row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
input[type=range]{width:130px}
select{background:#0c0c0c;color:#fff;border:1px solid #444;border-radius:4px;padding:6px}
.toggle{appearance:none;width:38px;height:20px;border-radius:20px;background:#444;position:relative;cursor:pointer;outline:0}
.toggle:checked{background:#ddd}
.toggle:before{content:"";position:absolute;width:16px;height:16px;top:2px;left:2px;border-radius:50%;background:#111;transition:.12s}
.toggle:checked:before{left:20px}
#hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);visibility:hidden;opacity:0;transition:.12s;z-index:5}
#overlay.show{visibility:visible;opacity:1}
.card{width:min(420px,90vw);background:#171717;border:1px solid #444;border-radius:8px;padding:26px;text-align:center}
.card h2{font-size:28px;margin:0 0 7px}.card p{color:#bbb;margin:0 0 18px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:#eee;color:#111;padding:9px 13px;border-radius:5px;font-size:12px;opacity:0;pointer-events:none;transition:.16s;z-index:8}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.layout{grid-template-columns:1fr}#hud{justify-content:flex-start}header{align-items:start;flex-direction:column}.panel{order:2}}
</style>
</head>
<body>
<div id="app">
<header>
<div><h1>Snake</h1><div class="subtitle">Retro core · modifier-driven rules</div></div>
<div id="hud">
<div class="stat"><b id="score">0</b><span>Score</span></div>
<div class="stat"><b id="length">3</b><span>Length</span></div>
<div class="stat"><b id="best">0</b><span>Best</span></div>
<div class="stat"><b id="time">0:00</b><span>Time</span></div>
</div>
</header>
<div class="layout">
<main>
<div class="stage"><canvas id="game" width="600" height="600"></canvas></div>
<div class="toolbar">
<button id="start">New Game</button>
<button id="pause" class="secondary">Pause</button>
<button id="random" class="secondary">Randomize</button>
<button id="reset" class="secondary">Reset Settings</button>
</div>
<div id="hint">Arrow keys / WASD · Space pause · Enter new game · R randomize modifiers</div>
</main>
<aside class="panel">
<h2>Modifier Lab</h2>
<div class="group">
<div class="row"><label>Map size<small>More cells = more room</small></label><select id="mapSize"><option value="15">15 × 15</option><option value="20" selected>20 × 20</option><option value="25">25 × 25</option><option value="30">30 × 30</option><option value="35">35 × 35</option><option value="40">40 × 40</option></select></div>
<div class="row"><label>Food on map<small>Simultaneous pickups</small></label><input id="foodCount" type="range" min="1" max="12" value="1"><b id="foodCountVal">1</b></div>
<div class="row"><label>Food value<small>Points per pickup</small></label><input id="foodValue" type="range" min="1" max="25" value="1"><b id="foodValueVal">1</b></div>
<div class="row"><label>Starting length<small>Initial body size</small></label><input id="startLength" type="range" min="1" max="20" value="3"><b id="startLengthVal">3</b></div>
</div>
<div class="group">
<div class="row"><label>Speed<small>Milliseconds per tick</small></label><input id="speed" type="range" min="35" max="220" step="5" value="100"><b id="speedVal">100</b></div>
<div class="row"><label>Speed growth<small>Gets faster as you score</small></label><input id="speedGrowth" type="range" min="0" max="10" value="0"><b id="speedGrowthVal">0%</b></div>
<div class="row"><label>Wrap walls<small>Edges teleport to opposite side</small></label><input id="wrap" class="toggle" type="checkbox"></div>
<div class="row"><label>Self collision<small>Can the snake hit itself?</small></label><input id="selfCollision" class="toggle" type="checkbox" checked></div>
</div>
<div class="group">
<div class="row"><label>Grid lines<small>Retro board guides</small></label><input id="grid" class="toggle" type="checkbox"></div>
<div class="row"><label>Ghost food<small>Food flickers instead of staying solid</small></label><input id="ghostFood" class="toggle" type="checkbox"></div>
<div class="row"><label>Food respawn<small>Keep food count topped up</small></label><input id="respawn" class="toggle" type="checkbox" checked></div>
<div class="row"><label>Obstacles<small>Static collision blocks</small></label><input id="obstacles" type="range" min="0" max="25" value="0"><b id="obstaclesVal">0</b></div>
</div>
<div class="group">
<div class="row"><label>Bonus food chance<small>Extra points pickup</small></label><input id="bonusChance" type="range" min="0" max="100" value="0"><b id="bonusChanceVal">0%</b></div>
<div class="row"><label>Golden multiplier<small>Bonus food value</small></label><input id="goldMultiplier" type="range" min="2" max="10" value="3"><b id="goldMultiplierVal">3×</b></div>
<div class="row"><label>Near-miss bonus<small>Reward risky turns</small></label><input id="nearMiss" class="toggle" type="checkbox"></div>
<div class="row"><label>Perfect-board bonus<small>Extra point for clearing food</small></label><input id="perfectBonus" class="toggle" type="checkbox"></div>
</div>
<div class="group">
<div class="row"><label>Theme</label><select id="theme"><option value="mono">Monochrome</option><option value="green">Terminal Green</option><option value="amber">Amber Terminal</option><option value="ice">Cold CRT</option></select></div>
<div class="row"><label>Snake style</label><select id="snakeStyle"><option value="block">Block</option><option value="dot">Dot</option><option value="outline">Outline</option><option value="scan">Scanline</option></select></div>
<div class="row"><label>Food style</label><select id="foodStyle"><option value="block">Block</option><option value="dot">Dot</option><option value="cross">Cross</option><option value="diamond">Diamond</option></select></div>
</div>
</aside>
</div>
</div>
<div id="overlay"><div class="card"><h2 id="message">Game Over</h2><p>Score: <span id="finalScore">0</span> · Length: <span id="finalLength">0</span></p><button id="restart">Play Again</button></div></div>
<div id="toast"></div>
<script>
"use strict";
(() => {
const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");
const DEFAULTS={
 mapSize:20,foodCount:1,foodValue:1,startLength:3,speed:100,speedGrowth:0,
 wrap:false,selfCollision:true,grid:false,ghostFood:false,respawn:true,obstacles:0,
 bonusChance:0,goldMultiplier:3,nearMiss:false,perfectBonus:false,theme:"mono",
 snakeStyle:"block",foodStyle:"block"
};
const THEMES={
 mono:{bg:"#000",snake:"#fff",head:"#fff",food:"#fff",bonus:"#fff",grid:"#161616",obstacle:"#555"},
 green:{bg:"#001000",snake:"#54ff54",head:"#b6ffb6",food:"#7dff4f",bonus:"#fff45c",grid:"#103510",obstacle:"#276327"},
 amber:{bg:"#100a00",snake:"#ffbf3f",head:"#ffe29a",food:"#ff9d2e",bonus:"#fff0a0",grid:"#382300",obstacle:"#8b5b1a"},
 ice:{bg:"#001018",snake:"#8de7ff",head:"#e1fbff",food:"#42cfff",bonus:"#fff",grid:"#0d2b36",obstacle:"#37606d"}
};
let settings={...DEFAULTS};
let snake=[],foods=[],obstacles=[],direction={x:1,y:0},queued={x:1,y:0};
let score=0,best=Number(localStorage.getItem("snake-best")||0);
let running=false,paused=false,gameStart=0,elapsed=0,timer=null,lastFrame=0;
let inputQueue=[];
let particles=[],flash=0,toastTimer=null;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function rand(n){return Math.floor(Math.random()*n)}
function same(a,b){return a.x===b.x&&a.y===b.y}
function key(p){return p.x+","+p.y}
function readSettings(){
 settings.mapSize=Number($("mapSize").value);
 settings.foodCount=Number($("foodCount").value);
 settings.foodValue=Number($("foodValue").value);
 settings.startLength=Number($("startLength").value);
 settings.speed=Number($("speed").value);
 settings.speedGrowth=Number($("speedGrowth").value);
 settings.wrap=$("wrap").checked;
 settings.selfCollision=$("selfCollision").checked;
 settings.grid=$("grid").checked;
 settings.ghostFood=$("ghostFood").checked;
 settings.respawn=$("respawn").checked;
 settings.obstacles=Number($("obstacles").value);
 settings.bonusChance=Number($("bonusChance").value);
 settings.goldMultiplier=Number($("goldMultiplier").value);
 settings.nearMiss=$("nearMiss").checked;
 settings.perfectBonus=$("perfectBonus").checked;
 settings.theme=$("theme").value;
 settings.snakeStyle=$("snakeStyle").value;
 settings.foodStyle=$("foodStyle").value;
 updateLabels();
 resizeCanvas();
}
function updateLabels(){
 $("foodCountVal").textContent=settings.foodCount;
 $("foodValueVal").textContent=settings.foodValue;
 $("startLengthVal").textContent=settings.startLength;
 $("speedVal").textContent=settings.speed;
 $("speedGrowthVal").textContent=settings.speedGrowth+"%";
 $("obstaclesVal").textContent=settings.obstacles;
 $("bonusChanceVal").textContent=settings.bonusChance+"%";
 $("goldMultiplierVal").textContent=settings.goldMultiplier+"×";
 $("best").textContent=best;
}
function saveSettings(){
 localStorage.setItem("snake-settings",JSON.stringify(settings));
}
function loadSettings(){
 try{
  const saved=JSON.parse(localStorage.getItem("snake-settings")||"null");
  if(saved) settings={...DEFAULTS,...saved};
 }catch(e){settings={...DEFAULTS}}
 applySettingsToUI();
}
function applySettingsToUI(){
 $("mapSize").value=settings.mapSize;
 $("foodCount").value=settings.foodCount;
 $("foodValue").value=settings.foodValue;
 $("startLength").value=settings.startLength;
 $("speed").value=settings.speed;
 $("speedGrowth").value=settings.speedGrowth;
 $("wrap").checked=settings.wrap;
 $("selfCollision").checked=settings.selfCollision;
 $("grid").checked=settings.grid;
 $("ghostFood").checked=settings.ghostFood;
 $("respawn").checked=settings.respawn;
 $("obstacles").value=settings.obstacles;
 $("bonusChance").value=settings.bonusChance;
 $("goldMultiplier").value=settings.goldMultiplier;
 $("nearMiss").checked=settings.nearMiss;
 $("perfectBonus").checked=settings.perfectBonus;
 $("theme").value=settings.theme;
 $("snakeStyle").value=settings.snakeStyle;
 $("foodStyle").value=settings.foodStyle;
 updateLabels();
}
function resizeCanvas(){
 const side=settings.mapSize;
 canvas.width=side*30;
 canvas.height=side*30;
}
function resetSettings(){
 settings={...DEFAULTS};
 applySettingsToUI();
 saveSettings();
 newGame();
 toast("Settings reset");
}
function randomize(){
 const choices={
  mapSize:[15,20,25,30,35,40],
  foodCount:rand(12)+1,
  foodValue:rand(8)+1,
  startLength:clamp(rand(10)+2,2,20),
  speed:35+rand(30)*5,
  speedGrowth:rand(7)*2,
  wrap:Math.random()<.35,
  selfCollision:Math.random()<.85,
  grid:Math.random()<.5,
  ghostFood:Math.random()<.35,
  respawn:true,
  obstacles:rand(16),
  bonusChance:rand(61),
  goldMultiplier:2+rand(6),
  nearMiss:Math.random()<.5,
  perfectBonus:Math.random()<.5,
  theme:Object.keys(THEMES)[rand(4)],
  snakeStyle:["block","dot","outline","scan"][rand(4)],
  foodStyle:["block","dot","cross","diamond"][rand(4)]
 };
 settings={...settings,...choices};
 applySettingsToUI();
 saveSettings();
 newGame();
 toast("Random modifier set generated");
}
function startSnake(){
 const center=Math.floor(settings.mapSize/2);
 snake=[];
 for(let i=0;i<settings.startLength;i++) snake.push({x:center-i,y:center});
 direction={x:1,y:0};
 queued={x:1,y:0};
}
function cellAvailable(p){
 if(p.x<0||p.x>=settings.mapSize||p.y<0||p.y>=settings.mapSize)return false;
 if(snake.some(s=>same(s,p)))return false;
 if(obstacles.some(o=>same(o,p)))return false;
 if(foods.some(f=>same(f,p)))return false;
 return true;
}
function randomOpenCell(){
 const total=settings.mapSize*settings.mapSize;
 for(let tries=0;tries<total*2;tries++){
  const p={x:rand(settings.mapSize),y:rand(settings.mapSize)};
  if(cellAvailable(p))return p;
 }
 return null;
}
function buildObstacles(){
 obstacles=[];
 const wanted=settings.obstacles;
 let attempts=0;
 while(obstacles.length<wanted&&attempts<wanted*30){
  attempts++;
  const p=randomOpenCell();
  if(!p)break;
  const center=Math.floor(settings.mapSize/2);
  if(Math.abs(p.x-center)<3&&Math.abs(p.y-center)<2)continue;
  obstacles.push(p);
 }
}
function spawnFood(forceBonus=false){
 const p=randomOpenCell();
 if(!p)return;
 const bonus=forceBonus||Math.random()*100<settings.bonusChance;
 foods.push({x:p.x,y:p.y,bonus,value:bonus?settings.foodValue*settings.goldMultiplier:settings.foodValue,phase:Math.random()*Math.PI*2});
}
function fillFood(){
 const target=Math.min(settings.foodCount,settings.mapSize*settings.mapSize-1);
 while(foods.length<target)spawnFood();
}
function newGame(){
 stopTimer();
 readSettings();
 startSnake();
 buildObstacles();
 foods=[];
 fillFood();
 score=0;
 elapsed=0;
 particles=[];
 flash=0;
 inputQueue=[];
 running=true;
 paused=false;
 gameStart=performance.now();
 updateHUD();
 draw();
 startTimer();
}
function startTimer(){
 stopTimer();
 timer=setInterval(tick,getTickRate());
}
function stopTimer(){
 if(timer){clearInterval(timer);timer=null}
}
function getTickRate(){
 const growth=Math.pow(1-settings.speedGrowth/100,score);
 return Math.max(18,Math.round(settings.speed*growth));
}
function restartTimerIfNeeded(){
 if(running&&!paused)startTimer();
}
function queueDirection(x,y){
 if(!running)return;
 const base=inputQueue.length?inputQueue[inputQueue.length-1]:queued;
 if(x===-base.x&&y===-base.y)return;
 if(x===base.x&&y===base.y)return;
 if(inputQueue.length<3)inputQueue.push({x,y});
}
function consumeDirection(){
 if(inputQueue.length)queued=inputQueue.shift();
 direction=queued;
}
function nextHead(){
 let p={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
 if(settings.wrap){
  p.x=(p.x+settings.mapSize)%settings.mapSize;
  p.y=(p.y+settings.mapSize)%settings.mapSize;
 }
 return p;
}
function hitsWall(p){
 return !settings.wrap&&(p.x<0||p.x>=settings.mapSize||p.y<0||p.y>=settings.mapSize);
}
function hitsSelf(p){
 if(!settings.selfCollision)return false;
 const eating=foods.some(f=>same(f,p));
 const limit=eating?snake.length:snake.length-1;
 for(let i=0;i<limit;i++)if(same(snake[i],p))return true;
 return false;
}
function hitsObstacle(p){
 return obstacles.some(o=>same(o,p));
}
function eatAt(p){
 const eaten=foods.filter(f=>same(f,p));
 if(!eaten.length)return 0;
 let gained=0;
 eaten.forEach(f=>{
  gained+=f.value;
  burst(f.x,f.y,f.bonus?12:7,f.bonus);
 });
 foods=foods.filter(f=>!same(f,p));
 return gained;
}
function tick(){
 if(!running||paused)return;
 consumeDirection();
 const head=nextHead();
 if(hitsWall(head)||hitsSelf(head)||hitsObstacle(head)){
  gameOver("Game Over");
  return;
 }
 const gained=eatAt(head);
 snake.unshift(head);
 if(gained>0){
  score+=gained;
  if(settings.perfectBonus&&foods.length===0)score+=settings.foodValue;
  if(settings.respawn)fillFood();
  flash=1;
  restartTimerIfNeeded();
 }else{
  snake.pop();
 }
 if(settings.nearMiss)nearMissCheck(head);
 elapsed=(performance.now()-gameStart)/1000;
 updateHUD();
 draw();
}
function nearMissCheck(head){
 const neighbors=[
  {x:head.x+1,y:head.y},{x:head.x-1,y:head.y},
  {x:head.x,y:head.y+1},{x:head.x,y:head.y-1}
 ];
 const danger=neighbors.some(p=>snake.some((s,i)=>i>0&&same(p,s))||obstacles.some(o=>same(p,o)));
 if(danger&&Math.random()<.12){
  score+=1;
  toast("Near-miss +1");
 }
}
function gameOver(reason){
 running=false;
 paused=false;
 stopTimer();
 if(score>best){
  best=score;
  localStorage.setItem("snake-best",String(best));
 }
 $("message").textContent=reason;
 $("finalScore").textContent=score;
 $("finalLength").textContent=snake.length;
 $("overlay").classList.add("show");
 updateHUD();
 draw();
}
function togglePause(){
 if(!running)return;
 paused=!paused;
 if(paused){
  stopTimer();
  $("message").textContent="Paused";
  $("finalScore").textContent=score;
  $("finalLength").textContent=snake.length;
  $("overlay").classList.add("show");
 }else{
  $("overlay").classList.remove("show");
  gameStart=performance.now()-elapsed*1000;
  startTimer();
 }
}
function updateHUD(){
 $("score").textContent=score;
 $("length").textContent=snake.length;
 $("best").textContent=best;
 const total=Math.floor(elapsed);
 const m=Math.floor(total/60);
 const s=String(total%60).padStart(2,"0");
 $("time").textContent=m+":"+s;
}
function clearBoard(){
 const t=THEMES[settings.theme];
 ctx.fillStyle=t.bg;
 ctx.fillRect(0,0,canvas.width,canvas.height);
}
function cellSize(){
 return canvas.width/settings.mapSize;
}
function drawGrid(){
 if(!settings.grid)return;
 const t=THEMES[settings.theme],c=cellSize();
 ctx.strokeStyle=t.grid;
 ctx.lineWidth=1;
 for(let i=1;i<settings.mapSize;i++){
  const p=Math.round(i*c)+.5;
  ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,canvas.height);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(canvas.width,p);ctx.stroke();
 }
}
function drawObstacles(){
 const t=THEMES[settings.theme],c=cellSize();
 ctx.fillStyle=t.obstacle;
 obstacles.forEach(o=>{
  const x=o.x*c,y=o.y*c;
  ctx.fillRect(x+c*.12,y+c*.12,c*.76,c*.76);
  ctx.fillStyle=t.bg;
  ctx.fillRect(x+c*.28,y+c*.28,c*.44,c*.44);
  ctx.fillStyle=t.obstacle;
 });
}
function drawFood(){
 const t=THEMES[settings.theme],c=cellSize(),now=performance.now()/160;
 foods.forEach(f=>{
  if(settings.ghostFood&&Math.sin(now+f.phase)<-.25)return;
  const x=f.x*c,y=f.y*c;
  ctx.fillStyle=f.bonus?t.bonus:t.food;
  const inset=c*.18;
  if(settings.foodStyle==="dot"){
   ctx.beginPath();ctx.arc(x+c/2,y+c/2,c*.28,0,Math.PI*2);ctx.fill();
  }else if(settings.foodStyle==="cross"){
   ctx.fillRect(x+c*.35,y+c*.12,c*.3,c*.76);
   ctx.fillRect(x+c*.12,y+c*.35,c*.76,c*.3);
  }else if(settings.foodStyle==="diamond"){
   ctx.beginPath();ctx.moveTo(x+c/2,y+inset);ctx.lineTo(x+c-inset,y+c/2);ctx.lineTo(x+c/2,y+c-inset);ctx.lineTo(x+inset,y+c/2);ctx.closePath();ctx.fill();
  }else{
   ctx.fillRect(x+inset,y+inset,c-inset*2,c-inset*2);
  }
 });
}
function drawSnake(){
 const t=THEMES[settings.theme],c=cellSize();
 snake.forEach((p,i)=>{
  const x=p.x*c,y=p.y*c;
  const isHead=i===0;
  ctx.fillStyle=isHead?t.head:t.snake;
  if(settings.snakeStyle==="dot"){
   ctx.beginPath();ctx.arc(x+c/2,y+c/2,c*(isHead?.38:.31),0,Math.PI*2);ctx.fill();
  }else if(settings.snakeStyle==="outline"){
   ctx.strokeStyle=t.snake;ctx.lineWidth=Math.max(1,c*.1);
   ctx.strokeRect(x+c*.13,y+c*.13,c*.74,c*.74);
  }else if(settings.snakeStyle==="scan"){
   ctx.fillRect(x+c*.1,y+c*.15,c*.8,c*.7);
   ctx.fillStyle=t.bg;
   ctx.fillRect(x+c*.1,y+c*.48,c*.8,Math.max(1,c*.07));
  }else{
   const pad=isHead?c*.06:c*.1;
   ctx.fillRect(x+pad,y+pad,c-pad*2,c-pad*2);
  }
  if(isHead)drawEyes(p,c);
 });
}
function drawEyes(p,c){

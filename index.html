<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#111;font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
#wrap{text-align:center}h1{font-size:32px;margin:0 0 12px;font-weight:700;letter-spacing:.5px}
#score{font-size:18px;margin-bottom:12px;color:#ddd}
canvas{display:block;background:#000;border:2px solid #333;image-rendering:pixelated}
#hint{margin-top:12px;color:#aaa;font-size:14px}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.58);visibility:hidden;opacity:0;transition:.15s}
#overlay.show{visibility:visible;opacity:1}.card{background:#181818;border:1px solid #444;border-radius:8px;padding:24px 30px;text-align:center}
.card h2{margin:0 0 8px}.card p{color:#bbb;margin:0 0 16px}
button{background:#fff;color:#111;border:0;border-radius:5px;padding:10px 18px;font-weight:700;cursor:pointer}
button:hover{background:#ddd}
</style>
</head>
<body>
<div id="wrap">
<h1>Snake</h1>
<div id="score">Score: <span id="value">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<div id="hint">Arrow keys / WASD to move · Space to pause</div>
</div>
<div id="overlay"><div class="card"><h2 id="message">Game Over</h2><p>Score: <span id="final">0</span></p><button id="restart">Play again</button></div></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('value'),overlay=document.getElementById('overlay');
const finalEl=document.getElementById('final'),messageEl=document.getElementById('message');
const restart=document.getElementById('restart');
const size=20, cells=20, speed=100;
let snake,food,dir,nextDir,score,running,paused,timer;

function reset(){
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; paused=false; running=true;
 scoreEl.textContent=score; overlay.classList.remove('show'); placeFood(); draw();
 clearInterval(timer); timer=setInterval(tick,speed);
}
function placeFood(){
 do{food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}
 while(snake.some(p=>p.x===food.x&&p.y===food.y));
}
function setDir(x,y){
 if(!running)return;
 if(x===-dir.x&&y===-dir.y)return;
 nextDir={x,y};
}
function tick(){
 if(!running||paused)return;
 dir=nextDir;
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||
    snake.some((p,i)=>i>0&&p.x===head.x&&p.y===head.y)){gameOver();return}
 snake.unshift(head);
 if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;placeFood()}
 else snake.pop();
 draw();
}
function draw(){
 ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#fff';
 snake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-1,size-1));
 ctx.fillStyle='#fff';ctx.fillRect(food.x*size,food.y*size,size-1,size-1);
}
function gameOver(){
 running=false;clearInterval(timer);finalEl.textContent=score;messageEl.textContent='Game Over';overlay.classList.add('show');
}
function togglePause(){
 if(!running)return;paused=!paused;
 messageEl.textContent=paused?'Paused':'Game Over';finalEl.textContent=score;
 overlay.classList.toggle('show',paused);
 if(paused){clearInterval(timer)}else{overlay.classList.remove('show');timer=setInterval(tick,speed)}
}
document.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(k==='arrowup'||k==='w')setDir(0,-1);
 else if(k==='arrowdown'||k==='s')setDir(0,1);
 else if(k==='arrowleft'||k==='a')setDir(-1,0);
 else if(k==='arrowright'||k==='d')setDir(1,0);
 else if(k===' ')togglePause();
 else if(k==='enter'&&!running)reset();
});
restart.addEventListener('click',reset);
reset();
})();
</script>
</body>
</html>

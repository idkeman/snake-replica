<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake — Modifier Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
<div><h1>Snake</h1><div class="subtitle">Retro core · modifier-driven rules</div></div>
<div id="hud">
<div class="stat"><b id="score">0</b><span>Score</span></div>
<div class="stat"><b id="length">3</b><span>Length</span></div>
<div class="stat"><b id="best">0</b><span>Best</span></div>
<div class="stat"><b id="time">0:00</b><span>Time</span></div>
</div>
</header>
<div class="layout">
<main>
<div class="stage"><canvas id="game" width="600" height="600"></canvas></div>
<div class="toolbar">
<button id="start">New Game</button>
<button id="pause" class="secondary">Pause</button>
<button id="random" class="secondary">Randomize</button>
<button id="reset" class="secondary">Reset Settings</button>
</div>
<div id="hint">Arrow keys / WASD · Space pause · Enter new game · R randomize modifiers</div>
</main>
<aside class="panel">
<h2>Modifier Lab</h2>
<div class="group">
<div class="row"><label>Map size<small>More cells = more room</small></label><select id="mapSize"><option value="15">15 × 15</option><option value="20" selected>20 × 20</option><option value="25">25 × 25</option><option value="30">30 × 30</option><option value="35">35 × 35</option><option value="40">40 × 40</option></select></div>
<div class="row"><label>Food on map<small>Simultaneous pickups</small></label><input id="foodCount" type="range" min="1" max="12" value="1"><b id="foodCountVal">1</b></div>
<div class="row"><label>Food value<small>Points per pickup</small></label><input id="foodValue" type="range" min="1" max="25" value="1"><b id="foodValueVal">1</b></div>
<div class="row"><label>Starting length<small>Initial body size</small></label><input id="startLength" type="range" min="1" max="20" value="3"><b id="startLengthVal">3</b></div>
</div>
<div class="group">
<div class="row"><label>Speed<small>Milliseconds per tick</small></label><input id="speed" type="range" min="35" max="220" step="5" value="100"><b id="speedVal">100</b></div>
<div class="row"><label>Speed growth<small>Gets faster as you score</small></label><input id="speedGrowth" type="range" min="0" max="10" value="0"><b id="speedGrowthVal">0%</b></div>
<div class="row"><label>Wrap walls<small>Edges teleport to opposite side</small></label><input id="wrap" class="toggle" type="checkbox"></div>
<div class="row"><label>Self collision<small>Can the snake hit itself?</small></label><input id="selfCollision" class="toggle" type="checkbox" checked></div>
</div>
<div class="group">
<div class="row"><label>Grid lines<small>Retro board guides</small></label><input id="grid" class="toggle" type="checkbox"></div>
<div class="row"><label>Ghost food<small>Food flickers instead of staying solid</small></label><input id="ghostFood" class="toggle" type="checkbox"></div>
<div class="row"><label>Food respawn<small>Keep food count topped up</small></label><input id="respawn" class="toggle" type="checkbox" checked></div>
<div class="row"><label>Obstacles<small>Static collision blocks</small></label><input id="obstacles" type="range" min="0" max="25" value="0"><b id="obstaclesVal">0</b></div>
</div>
<div class="group">
<div class="row"><label>Bonus food chance<small>Extra points pickup</small></label><input id="bonusChance" type="range" min="0" max="100" value="0"><b id="bonusChanceVal">0%</b></div>
<div class="row"><label>Golden multiplier<small>Bonus food value</small></label><input id="goldMultiplier" type="range" min="2" max="10" value="3"><b id="goldMultiplierVal">3×</b></div>
<div class="row"><label>Near-miss bonus<small>Reward risky turns</small></label><input id="nearMiss" class="toggle" type="checkbox"></div>
<div class="row"><label>Perfect-board bonus<small>Extra point for clearing food</small></label><input id="perfectBonus" class="toggle" type="checkbox"></div>
</div>
<div class="group">
<div class="row"><label>Theme</label><select id="theme"><option value="mono">Monochrome</option><option value="green">Terminal Green</option><option value="amber">Amber Terminal</option><option value="ice">Cold CRT</option></select></div>
<div class="row"><label>Snake style</label><select id="snakeStyle"><option value="block">Block</option><option value="dot">Dot</option><option value="outline">Outline</option><option value="scan">Scanline</option></select></div>
<div class="row"><label>Food style</label><select id="foodStyle"><option value="block">Block</option><option value="dot">Dot</option><option value="cross">Cross</option><option value="diamond">Diamond</option></select></div>
</div>
</aside>
</div>
</div>
<div id="overlay"><div class="card"><h2 id="message">Game Over</h2><p>Score: <span id="finalScore">0</span> · Length: <span id="finalLength">0</span></p><button id="restart">Play Again</button></div></div>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
